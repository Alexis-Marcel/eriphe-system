// eriphe-base: apt in a task container (worker/README.md).
// Tasks run as root with no capability: apt cannot switch to its _apt user.
APT::Sandbox::User "root";
// Packages and lists in the node's cache volume, kept between tasks
// (eriphe-node creates the directories at each start).
Dir::Cache::Archives "/cache/apt/archives";
Dir::State::Lists "/cache/apt/lists";
APT::Keep-Downloaded-Packages "true";
Binary::apt::APT::Keep-Downloaded-Packages "true";
// Tasks of the same machine share the cache: wait for another's install.
DPkg::Lock::Timeout "600";
APT::Install-Recommends "false";
APT::Install-Suggests "false";
Acquire::Retries "3";
