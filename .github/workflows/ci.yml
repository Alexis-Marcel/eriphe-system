name: ci

on:
  push:
    branches: [main]
    # A release (RELEASING.md): its images get X.Y.Z, X.Y and latest.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # The version of this build and the tags its images get: vX.Y.Z (a tag
  # push) is X.Y.Z, under X.Y.Z, X.Y and latest (a prerelease, vX.Y.Z-rc.N,
  # under its own tag only); main is X.Y.Z-dev+<short sha>, X.Y.Z the last
  # release (0.0.0 before the first), under edge and sha-<short sha>.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tags: ${{ steps.v.outputs.tags }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The tags, for the last release, and main, for a release's commit.
          fetch-depth: 0
      - id: v
        run: |
          short=${GITHUB_SHA::7}
          pre=false
          case $GITHUB_REF in
            refs/tags/v*)
              v=${GITHUB_REF_NAME#v}
              n='(0|[1-9][0-9]*)'
              if ! printf '%s' "$v" | grep -Eq "^$n\.$n\.$n(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"; then
                echo "::error::$GITHUB_REF_NAME is not a release tag (vX.Y.Z, or vX.Y.Z-rc.N)"
                exit 1
              fi
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::$GITHUB_REF_NAME is not on main"
                exit 1
              fi
              case $v in
                *-*) tags=$v pre=true ;;
                *) tags="$v ${v%.*} latest" ;;
              esac
              ;;
            *)
              last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' HEAD 2>/dev/null || echo v0.0.0)
              v="${last#v}-dev+$short"
              tags="edge sha-$short"
              ;;
          esac
          {
            echo "version=$v"
            echo "tags=$tags"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"
          echo "version $v, tags $tags"

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: node/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=windows go build ./...

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  core-image:
    needs: [version, core]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: eriphe-core
      context: core
      version: ${{ needs.version.outputs.version }}
      tags: ${{ needs.version.outputs.tags }}
      version-arg: true
      # The installers ship in the image, for the portal (core/Dockerfile):
      # eriphe.com serves the ones of eriphe-core:latest, the latest release.
      build-contexts: install=install

  node-image:
    needs: [version, node]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: eriphe-node
      context: node
      version: ${{ needs.version.outputs.version }}
      tags: ${{ needs.version.outputs.tags }}
      version-arg: true

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh install/lint.sh
      - run: sh install/install.sh --help
      - name: parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install/install.ps1", [ref]$null, [ref]$errors)
          $errors | ForEach-Object { Write-Host "::error file=install/install.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
          if ($errors) { exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $found = Invoke-ScriptAnalyzer -Path install/install.ps1 -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost
          $found | Format-Table -AutoSize Severity, Line, RuleName, Message | Out-String -Width 240 | Write-Host
          if ($found | Where-Object Severity -eq Error) { exit 1 }

  worker:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: eriphe-worker
      context: worker
      version: ${{ needs.version.outputs.version }}
      tags: ${{ needs.version.outputs.tags }}

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  mail:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/mail
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: servers/mail/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: test -z "$(gofmt -l .)"

  mail-image:
    needs: [version, mail]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: eriphe-mail
      context: servers/mail
      version: ${{ needs.version.outputs.version }}
      tags: ${{ needs.version.outputs.tags }}
      version-arg: true

  calendar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/calendar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: servers/calendar/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: test -z "$(gofmt -l .)"

  calendar-image:
    needs: [version, calendar]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: eriphe-calendar
      context: servers/calendar
      version: ${{ needs.version.outputs.version }}
      tags: ${{ needs.version.outputs.tags }}
      version-arg: true

  files:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/files
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: servers/files/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: test -z "$(gofmt -l .)"

  files-image:
    needs: [version, files]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: eriphe-files
      context: servers/files
      version: ${{ needs.version.outputs.version }}
      tags: ${{ needs.version.outputs.tags }}
      version-arg: true

  # A release: its notes, generated from the pull requests since the last
  # one, once every image is published.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, core-image, node-image, worker, mail-image, calendar-image, files-image, install, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is released already"
            exit 0
          fi
          set -- --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
          if [ "$PRERELEASE" = true ]; then set -- "$@" --prerelease; else set -- "$@" --latest; fi
          gh release create "$TAG" "$@"
