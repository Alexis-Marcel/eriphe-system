name: ci

on:
  push:
    branches: [main]
    # A release by hand (RELEASING.md): its images get X.Y.Z, X.Y and latest.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# One run at a time per branch or tag: a push to main that releases has created its tag before
# the next push's run reads the tags, so two pushes never release the same version. A pull
# request's newer push cancels its older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The release script and its tests (.github/scripts, RELEASING.md).
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck .github/scripts/*.sh
      - run: sh .github/scripts/release_test.sh

  # The version of this build, the tags its images get, and whether it is a release
  # (RELEASING.md):
  # - a tag vX.Y.Z pushed by hand: X.Y.Z, under X.Y.Z, X.Y and latest (a prerelease,
  #   vX.Y.Z-rc.N, under its own tag only);
  # - a push to main whose commits since the last release call for one (Conventional
  #   Commits, .github/scripts/release.sh): the next version, the same way, which the
  #   release job tags once the images are published;
  # - otherwise X.Y.Z-dev+<short sha>, X.Y.Z the last release (0.0.0 before the first),
  #   under edge and sha-<short sha>.
  version:
    needs: scripts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tags: ${{ steps.v.outputs.tags }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The tags, for the last release and the commits since, and main, for a release's
          # commit.
          fetch-depth: 0
      - id: v
        env:
          EVENT: ${{ github.event_name }}
        run: |
          short=${GITHUB_SHA::7}
          pre=false release=false tag=
          # The last release (not a prerelease) at or before a commit.
          stable() { git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' "$@" 2>/dev/null; }
          case $GITHUB_REF in
            refs/tags/v*)
              v=${GITHUB_REF_NAME#v}
              n='(0|[1-9][0-9]*)'
              if ! printf '%s' "$v" | grep -Eq "^$n\.$n\.$n(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"; then
                echo "::error::$GITHUB_REF_NAME is not a release tag (vX.Y.Z, or vX.Y.Z-rc.N)"
                exit 1
              fi
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::$GITHUB_REF_NAME is not on main"
                exit 1
              fi
              case $v in *-*) pre=true ;; esac
              release=true tag=$GITHUB_REF_NAME
              ;;
            *)
              last=$(stable HEAD || true)
              base=${last:-v0.0.0}
              v="${base#v}-dev+$short"
              if [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
                if here=$(stable --exact-match HEAD); then
                  # This commit is released already (a re-run of its release run, or a tag
                  # pushed by hand): that release again, which the release job completes.
                  v=${here#v} release=true tag=$here
                else
                  next=$(.github/scripts/release.sh log "$last" | .github/scripts/release.sh next "${base#v}")
                  if [ -n "$next" ] && git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
                    echo "::warning::v$next exists already, on another commit: no release"
                  elif [ -n "$next" ]; then
                    echo "::notice::The commits since $base release v$next"
                    v=$next release=true tag=v$next
                  else
                    echo "::notice::No feat, fix, perf or breaking change since $base: no release"
                  fi
                fi
              fi
              ;;
          esac
          if [ "$release" = false ]; then
            tags="edge sha-$short"
          elif [ "$pre" = true ]; then
            tags=$v
          else
            tags="$v ${v%.*} latest"
          fi
          {
            echo "version=$v"
            echo "tags=$tags"
            echo "prerelease=$pre"
            echo "release=$release"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "version $v, tags $tags, release $release"

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # What a root task leaves in Eriphe/ goes back to its owner: needs root.
      - run: sudo "$(command -v go)" test -run HandBack -v .
      - run: GOOS=windows go build ./...

  # eriphe-cred, the SSH agent and tunnel the node lends every task.
  cred:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node/cred
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: node/cred/go.mod
          # No dependency, hence no go.sum: nothing to cache.
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
      - run: GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null .

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: go build ./...
      - run: go vet ./...
      # In memory: each test opens a SQLite database in t.TempDir(), whose every
      # migration syncs to disk.
      - run: go test ./...
        env:
          TMPDIR: /dev/shm

  # The composed workspace's app (core/web/espace): its layout engine's tests, and its
  # build, committed under core/web/static/espace so Go needs no Node, is up to date.
  espace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/web/espace
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/web/espace/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: The committed build is the build of the sources
        run: |
          git add -N ../static/espace
          git diff --exit-code -- ../static/espace || {
            echo "::error::core/web/static/espace differs from the build: run npm run build in core/web/espace and commit it"
            exit 1
          }

  # Every test passes before any image is published (the publish job): a release tags
  # `latest`, and a workspace offers that version as soon as one image has it.
  tests:
    needs: [scripts, node, cred, core, espace, install, cli, mail, calendar, files, signal]
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  core-image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: eriphe-core
      context: core
      version: ${{ needs.version.outputs.version }}
      version-arg: true
      go-cache: true

  node-image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: eriphe-node
      context: node
      # The installers it carries, for the updaters (node/Dockerfile).
      build-contexts: installer=install
      version: ${{ needs.version.outputs.version }}
      version-arg: true
      go-cache: true

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh install/lint.sh
      - run: sh install/launcher_test.sh
      - run: sh install/wsl_test.sh
      - run: sh install/install.sh --help
      - name: parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install/install.ps1", [ref]$null, [ref]$errors)
          $errors | ForEach-Object { Write-Host "::error file=install/install.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
          if ($errors) { exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $found = Invoke-ScriptAnalyzer -Path install/install.ps1 -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost
          $found | Format-Table -AutoSize Severity, Line, RuleName, Message | Out-String -Width 240 | Write-Host
          if ($found | Where-Object Severity -eq Error) { exit 1 }

  # ghcr.io/alexis-marcel/eriphe: eriphe-launcher, Eriphe from one container, with
  # install.sh's functions (install/README.md, One container).
  launcher-image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: eriphe
      context: install
      version: ${{ needs.version.outputs.version }}
      version-arg: true

  # The image tasks start from, and one image per agent the node injects into it
  # (worker/README.md).
  worker:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: eriphe-base
            context: worker/base
          - image: eriphe-agent-claude
            context: worker/agents/claude
          - image: eriphe-agent-codex
            context: worker/agents/codex
          - image: eriphe-agent-opencode
            context: worker/agents/opencode
          - image: eriphe-agent-vibe
            context: worker/agents/vibe
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      version: ${{ needs.version.outputs.version }}
      version-arg: true

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  mail:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/mail
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: servers/mail/go.mod
          cache-dependency-path: servers/mail/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: test -z "$(gofmt -l .)"

  mail-image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: eriphe-mail
      context: servers/mail
      version: ${{ needs.version.outputs.version }}
      version-arg: true

  calendar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/calendar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: servers/calendar/go.mod
          cache-dependency-path: servers/calendar/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: test -z "$(gofmt -l .)"

  calendar-image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: eriphe-calendar
      context: servers/calendar
      version: ${{ needs.version.outputs.version }}
      version-arg: true

  files:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/files
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: servers/files/go.mod
          cache-dependency-path: servers/files/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: test -z "$(gofmt -l .)"

  files-image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: eriphe-files
      context: servers/files
      version: ${{ needs.version.outputs.version }}
      version-arg: true

  signal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/signal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: servers/signal/go.mod
          cache-dependency-path: servers/signal/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: test -z "$(gofmt -l .)"

  signal-image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: eriphe-signal
      context: servers/signal
      version: ${{ needs.version.outputs.version }}
      version-arg: true

  # The images, built while the tests run and pushed by digest only on a push (image.yml),
  # published as one multi-arch manifest each under the build's tags once every test passed:
  # nothing is named, no version is published, before. One entry per image job above.
  publish:
    if: github.event_name == 'push'
    needs: [version, tests, core-image, node-image, launcher-image, worker, mail-image, calendar-image, files-image, signal-image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: eriphe-core
          - image: eriphe-node
          - image: eriphe
          # Also as eriphe-worker, the image it replaces: the updaters of the machines
          # installed before pull it (install/README.md).
          - image: eriphe-base
            aliases: eriphe-worker
          - image: eriphe-agent-claude
          - image: eriphe-agent-codex
          - image: eriphe-agent-opencode
          - image: eriphe-agent-vibe
          - image: eriphe-mail
          - image: eriphe-calendar
          - image: eriphe-files
          - image: eriphe-signal
    name: publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/alexis-marcel/${{ matrix.image }}
      TAGS: ${{ needs.version.outputs.tags }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}--*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -- *
          [ $# -eq 2 ] || { echo "::error::want 2 digests (amd64, arm64), have: $*"; exit 1; }
          set --
          for tag in $TAGS; do set -- "$@" -t "${REGISTRY_IMAGE}:${tag}"; done
          [ $# -gt 0 ] || { echo "::error::no tag to publish"; exit 1; }
          # shellcheck disable=SC2046 # one argument per digest
          docker buildx imagetools create "$@" $(printf "${REGISTRY_IMAGE}@sha256:%s " *)
      # The same manifest under each alias, from the image just published.
      - if: matrix.aliases
        env:
          ALIASES: ${{ matrix.aliases }}
        run: |
          for alias in $ALIASES; do
            set --
            for tag in $TAGS; do set -- "$@" -t "ghcr.io/alexis-marcel/${alias}:${tag}"; done
            docker buildx imagetools create "$@" "${REGISTRY_IMAGE}:${TAGS%% *}"
          done
      - run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${TAGS%% *}"

  # A release, once every check passed and every image is published under its
  # tags: the tag vX.Y.Z on this commit (unless pushed by hand), then the GitHub
  # release, its notes grouped from the commits since the last release, and the
  # install scripts attached to it (install/README.md). Each step that is done
  # already is skipped, so a failed run can be re-run; the scripts are uploaded
  # again every time. The tag is pushed with the workflow's token, which starts
  # no other run.
  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, tests, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The released commit, so the scripts attached are the release's.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            at=$(git rev-parse "$TAG^{commit}")
            if [ "$at" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG exists already, on $at"
              exit 1
            fi
            echo "$TAG exists already"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Eriphe $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is released already"
            exit 0
          fi
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' "$TAG^" 2>/dev/null || true)
          notes=$RUNNER_TEMP/notes.md
          .github/scripts/release.sh log "$prev" "$TAG" | .github/scripts/release.sh notes > "$notes"
          if [ -n "$prev" ]; then
            printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$TAG" >> "$notes"
          fi
          cat "$notes"
          set -- --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$notes"
          if [ "$PRERELEASE" = true ]; then set -- "$@" --prerelease; else set -- "$@" --latest; fi
          gh release create "$TAG" "$@"
      # Served as releases/latest/download/install.sh (and install.ps1).
      - name: Install scripts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" install/install.sh install/install.ps1 --clobber --repo "$GITHUB_REPOSITORY"
