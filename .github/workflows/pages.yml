name: pages

# Publishes site/ on the repository's GitHub Pages. It holds Eriphe's OAuth Client ID
# Metadata Document (site/oauth/client.json): a service that takes CIMD clients only reads
# it to learn who "Eriphe" is. Its URL is the client_id, so it must not move; it describes
# no installation, only the loopback redirect every Eriphe uses (issue #396).

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The document is valid JSON, and its client_id is the address it is published at.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          id=$(jq -r .client_id site/oauth/client.json)
          test "$id" = "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/oauth/client.json"
          jq -e '.redirect_uris == ["http://127.0.0.1:8976/callback"] and .token_endpoint_auth_method == "none"' site/oauth/client.json

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
