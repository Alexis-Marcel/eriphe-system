# Builds one image for linux/amd64 and linux/arm64, each on a native runner
# (no emulation). On a push (to main, or of a release tag), each
# architecture is pushed by digest, with no name, and its digest is kept as
# an artifact: ci.yml's publish job, once every test passed, publishes them as
# one multi-arch manifest under the build's tags. Pull requests build both
# architectures without pushing.
name: image

on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/alexis-marcel (e.g. eriphe-base)
        type: string
        required: true
      context:
        description: Build context (the directory holding the Dockerfile)
        type: string
        required: true
      version:
        description: The build's version (0.2.0, or 0.2.0-dev+<short sha> for main), see RELEASING.md
        type: string
        required: true
      version-arg:
        description: Pass VERSION=<version> as a build argument (the binary's and the image label's)
        type: boolean
        default: false
      go-cache:
        description: >-
          Keep the Go module and build caches the Dockerfile mounts (/go/pkg/mod,
          /root/.cache/go-build) between runs: restored on every build, saved by main's
          pushes only, so pull requests do not crowd them out of the repository's cache.
        type: boolean
        default: false
      build-contexts:
        description: Other build contexts, name=path lines (e.g. installer=install for eriphe-node)
        type: string
        default: ''

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/alexis-marcel/${{ inputs.image }}
  PUSH: ${{ github.event_name == 'push' }}
  SAVE_GO_CACHE: true # TEMP: measure, to revert

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      # BuildKit keeps its cache mounts inside the builder, which is new on every
      # run: the cache dance injects them from the Actions cache before the build
      # and, in its post step, takes them out of the builder after it. On main,
      # actions/cache's post step, which runs after (posts run in reverse order),
      # saves them; elsewhere they are only restored.
      - if: inputs.go-cache && env.SAVE_GO_CACHE == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/go-cache
          key: go-cache-${{ inputs.image }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: go-cache-${{ inputs.image }}-${{ matrix.arch }}-
      - if: inputs.go-cache && env.SAVE_GO_CACHE != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/go-cache
          key: go-cache-${{ inputs.image }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: go-cache-${{ inputs.image }}-${{ matrix.arch }}-
      - if: inputs.go-cache
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "${{ runner.temp }}/go-cache/mod": "/go/pkg/mod",
              "${{ runner.temp }}/go-cache/build": "/root/.cache/go-build"
            }
          skip-extraction: ${{ env.SAVE_GO_CACHE != 'true' }}
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          build-contexts: ${{ inputs.build-contexts }}
          platforms: linux/${{ matrix.arch }}
          # eriphe-core tells when a machine is behind by it (core/updates.go).
          build-args: ${{ inputs.version-arg && format('VERSION={0}', inputs.version) || '' }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY_IMAGE) || '' }}
      - if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.image }}--${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
