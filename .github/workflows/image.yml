# Builds one image for linux/amd64 and linux/arm64, each on a native runner
# (no emulation). On a push to main, each architecture is pushed by digest and
# the merge job publishes them as one multi-arch manifest under the image's
# tags. Pull requests build both architectures without pushing.
name: image

on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/alexis-marcel (e.g. eriphe-worker)
        type: string
        required: true
      context:
        description: Build context (the directory holding the Dockerfile)
        type: string
        required: true
      version-arg:
        description: >-
          Pass VERSION=sha-<short sha> as a build argument, the sha being the last commit that
          changed the build context (and version-paths): a rebuild with nothing new keeps its version
        type: boolean
        default: false
      version-paths:
        description: Other paths whose changes go into the image, space-separated (e.g. install)
        type: string
        default: ""
      build-contexts:
        description: Extra named build contexts, name=path per line (e.g. install=install)
        type: string
        default: ""

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/alexis-marcel/${{ inputs.image }}
  PUSH: ${{ github.event_name == 'push' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, to find the last commit that changed the image.
          fetch-depth: ${{ inputs.version-arg && '0' || '1' }}
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version (binary and image label) is the last commit that changed
      # what goes into the image, not the commit built: eriphe-core tells
      # when a machine is behind by it (core/updates.go).
      - id: sha
        env:
          PATHS: ${{ inputs.context }} ${{ inputs.version-paths }}
        run: |
          if [ "${{ inputs.version-arg }}" = true ]; then
            # shellcheck disable=SC2086 # one argument per path
            last=$(git log -1 --format=%H -- $PATHS)
            [ -n "$last" ] || { echo "no commit changed $PATHS" >&2; exit 1; }
          else
            last=$GITHUB_SHA
          fi
          echo "short=${last::7}" >> "$GITHUB_OUTPUT"
          echo "version: sha-${last::7}"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          platforms: linux/${{ matrix.arch }}
          build-contexts: ${{ inputs.build-contexts }}
          build-args: ${{ inputs.version-arg && format('VERSION=sha-{0}', steps.sha.outputs.short) || '' }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY_IMAGE) || '' }}
      - if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          short="${GITHUB_SHA::7}"
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:latest" \
            -t "${REGISTRY_IMAGE}:sha-${short}" \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)
      - run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:latest"
