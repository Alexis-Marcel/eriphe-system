# Builds one image for linux/amd64 and linux/arm64, each on a native runner
# (no emulation). On a push (to main, or of a release tag), each
# architecture is pushed by digest and the merge job publishes them as one
# multi-arch manifest under the tags it is given (ci.yml's version job:
# X.Y.Z, X.Y and latest for a release; edge and sha-<short> otherwise).
# Pull requests build both architectures without pushing.
name: image

on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/alexis-marcel (e.g. eriphe-base)
        type: string
        required: true
      context:
        description: Build context (the directory holding the Dockerfile)
        type: string
        required: true
      version:
        description: The build's version (0.2.0, or 0.2.0-dev+<short sha> for main), see RELEASING.md
        type: string
        required: true
      tags:
        description: The tags to publish, space-separated (e.g. "0.2.0 0.2 latest")
        type: string
        required: true
      version-arg:
        description: Pass VERSION=<version> as a build argument (the binary's and the image label's)
        type: boolean
        default: false
      aliases:
        description: Other image names under ghcr.io/alexis-marcel that get the same tags (e.g. eriphe-worker)
        type: string
        default: ''

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/alexis-marcel/${{ inputs.image }}
  PUSH: ${{ github.event_name == 'push' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          platforms: linux/${{ matrix.arch }}
          # eriphe-core tells when a machine is behind by it (core/updates.go).
          build-args: ${{ inputs.version-arg && format('VERSION={0}', inputs.version) || '' }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY_IMAGE) || '' }}
      - if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          set --
          for tag in $TAGS; do set -- "$@" -t "${REGISTRY_IMAGE}:${tag}"; done
          [ $# -gt 0 ] || { echo "::error::no tag to publish"; exit 1; }
          # shellcheck disable=SC2046 # one argument per digest
          docker buildx imagetools create "$@" $(printf "${REGISTRY_IMAGE}@sha256:%s " *)
      # The same manifest under each alias, from the image just published.
      - if: inputs.aliases != ''
        env:
          TAGS: ${{ inputs.tags }}
          ALIASES: ${{ inputs.aliases }}
        run: |
          for alias in $ALIASES; do
            set --
            for tag in $TAGS; do set -- "$@" -t "ghcr.io/alexis-marcel/${alias}:${tag}"; done
            docker buildx imagetools create "$@" "${REGISTRY_IMAGE}:${TAGS%% *}"
          done
      - env:
          TAGS: ${{ inputs.tags }}
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${TAGS%% *}"
